/* layout: 左＝夕暮れのマンション（階＝分野のノード）、右＝夕焼けの William の部屋。相談票は金縁の紙のパネルで部屋の手前に浮かぶ。
   ゲームのイベントページ風：金の二重枠・光のスイープ・星のはじけ・スタンプ・報酬演出 */
:root {
	--ink: #2b2522; --ink-soft: #5a4a40; --paper: #f7f1e3; --paper-2: #ece3cf;
	--gold: #c9a45c; --gold-hi: #f3dfa2; --gold-lo: #8a6a35;
	--night: #152754; --night-2: #0d1838; --dusk: #3a2f5c;
	--ok: #4fae73; --ng: #d9615a; --r5: #f2b24a; --lilac: #a68cd8;
	--ease-back: cubic-bezier(.34, 1.56, .64, 1); --ease-quint: cubic-bezier(.22, 1, .36, 1); --ease-io: cubic-bezier(.65, 0, .35, 1);
	--mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
	--maru: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
	--kiwi: "Kiwi Maru", "Zen Maru Gothic", sans-serif;
	--impact: "Dela Gothic One", "Zen Maru Gothic", sans-serif;
	--latin: "Cinzel", "Times New Roman", serif;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--night-2); color: var(--ink); font-family: var(--maru); line-height: 1.7; overflow-x: hidden; }
button { font: inherit; }
button:focus-visible { outline: 3px solid #ffe7a8; outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-columns: clamp(220px, calc((100vh - 88px) / 2 + 24px), 420px) minmax(0, 1fr); }
/* 楼的上下和题卡对齐：标题在上面 64px 的带里，楼从 64px 到底下 24px */

/* ---------- 左：マンション ---------- */
.tower { position: relative; background: linear-gradient(#0d1838, #2a2450 55%, #3a2f5c); color: #f3ead8; display: flex; flex-direction: column; padding-left: env(safe-area-inset-left, 0px); overflow: hidden; min-height: 0; }
.brand { height: 64px; padding: 10px 16px 0; position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; }
.brand .en { font-family: var(--latin); font-size: 11px; letter-spacing: .5em; color: var(--gold-hi); opacity: .85; }
.brand h1 { margin: 0; font-family: var(--mincho); font-weight: 800; font-size: 22px; letter-spacing: .08em; line-height: 1.2; text-shadow: 0 2px 18px rgba(255, 200, 120, .35); }
.brand h1 i { font-style: normal; color: var(--gold-hi); font-size: .6em; vertical-align: .55em; margin-left: 2px; }
.brand p, .brand .rule { display: none; }
.rule { display: flex; align-items: center; gap: 8px; color: var(--gold); margin: 10px 0 0; }
.rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, currentColor); }
.rule::after { transform: scaleX(-1); }
.rule i { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid currentColor; background: var(--gold-hi); }
.bldgwrap { flex: 1; min-height: 0; display: flex; justify-content: center; padding-bottom: 24px; }

.bldg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#0d1838 0%, transparent 16%); pointer-events: none; }
.track { position: absolute; left: 11%; top: 18.5%; bottom: 7.2%; width: 4px; border-radius: 4px; background: rgba(255, 255, 255, .15); box-shadow: 0 0 0 1px rgba(201, 164, 92, .5); }
.track b { position: absolute; left: 0; right: 0; bottom: 0; height: 0; border-radius: 4px; background: linear-gradient(var(--gold-hi), var(--r5)); box-shadow: 0 0 10px var(--r5); transition: height .8s var(--ease-quint); }
.plate { position: absolute; z-index: 2; left: 15.6%; width: 68.8%; border: 0; background: transparent; padding: 0; cursor: pointer; text-align: left; color: #fff; }
.plate .glass { display: none; position: absolute; inset: 6% 0 14%; border-radius: 4px; background: transparent; transition: background .3s, box-shadow .3s, transform .3s var(--ease-quint); }
.plate .tag { position: absolute; left: -12%; top: 50%; transform: translateY(-50%) scale(var(--tagS, 1)); transform-origin: left center; display: flex; align-items: center; gap: 6px; padding: 2px 10px 2px 4px; border-radius: 999px; background: linear-gradient(#3a3156, #241d3d); box-shadow: 0 0 0 1px var(--gold-lo), 0 0 0 3px rgba(13, 24, 56, .7), 0 4px 10px rgba(0, 0, 0, .35); transition: transform .3s var(--ease-quint); white-space: nowrap; }
.plate .fl { width: 26px; height: 26px; display: grid; place-items: center; font-family: var(--latin); font-weight: 700; font-size: 12px; color: var(--ink); background: linear-gradient(var(--gold-hi), var(--gold)); border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .6); }
.plate .nm { font-family: var(--mincho); font-weight: 700; font-size: 12px; letter-spacing: .04em; }
.plate .lk { font-size: 10px; opacity: .7; }
.plate:hover .tag, .plate:focus-visible .tag { transform: translate(6px, -50%) scale(var(--tagS, 1)); }
.plate.cur .glass { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(243, 223, 162, .55); }  /* 今の階は枠だけ。明かりは正解でつける */
.plate.cur .tag { background: linear-gradient(#fff5d9, #f0d08a); color: var(--ink); box-shadow: 0 0 0 1px var(--gold-lo), 0 0 0 3px rgba(255, 236, 190, .45), 0 0 18px rgba(255, 210, 140, .7); }
.plate.cur .fl { background: var(--night); color: var(--gold-hi); }
@keyframes flicker { 50% { opacity: .78; } }
.floorinfo { position: absolute; z-index: 3; left: 6%; right: 6%; top: 2.5%; min-height: 0; padding: 6px 12px; border-radius: 10px; background: rgba(13, 24, 56, .55); backdrop-filter: blur(4px); box-shadow: inset 0 0 0 1px rgba(201, 164, 92, .55); font-size: 12px; line-height: 1.6; color: #e9e2d2; }
.floorinfo b { font-family: var(--mincho); color: var(--gold-hi); font-size: 13px; }
.floorinfo.flash { animation: pop .28s var(--ease-back); }
.plate.sel .tag { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 14px rgba(243, 223, 162, .7); }
.floortip { position: absolute; z-index: 5; left: 50%; transform: translate(-50%, -110%); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 12px; box-shadow: 0 0 0 1px var(--gold), 0 0 0 4px var(--paper), 0 0 0 5px var(--gold-lo), 0 10px 24px rgba(0, 0, 0, .35); width: max-content; max-width: 240px; pointer-events: none; animation: pop .28s var(--ease-back); }
.floortip b { font-family: var(--mincho); }

/* ---------- 右：部屋 ---------- */
.room { position: relative; height: 100%; min-height: 0; overflow: hidden; touch-action: manipulation; background: #cf9a79; }
.room canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fg { pointer-events: none; z-index: 6; }
#l2d { pointer-events: none; z-index: 5; filter: sepia(.08) drop-shadow(0 2px 2px rgba(59, 36, 64, .38)); }
#l2d.heat { filter: sepia(.5) saturate(2.4) hue-rotate(-28deg) drop-shadow(0 2px 2px rgba(59, 36, 64, .38)); }
.bloom { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(circle at 82% 14%, rgba(255, 228, 170, .5), transparent 55%); mix-blend-mode: screen; }
.hud { position: absolute; z-index: 7; top: 14px; left: 24px; right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.hud > * { pointer-events: auto; }
.pill { padding: 3px 12px; border-radius: 999px; background: rgba(255, 250, 238, .78); border: 1px solid rgba(43, 37, 34, .15); font-weight: 700; font-size: 13px; color: var(--ink); backdrop-filter: blur(6px); font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; align-items: center; }
.pill.bump { animation: bump .22s var(--ease-back); }
@keyframes bump { 50% { transform: scale(1.25); } }
.pill .heart { color: var(--ng); }
.util { margin-left: auto; display: flex; gap: 8px; }
.util button { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid rgba(201, 164, 92, .9); background: rgba(43, 37, 34, .38); backdrop-filter: blur(6px); color: #fff7e0; display: grid; place-items: center; cursor: pointer; font-size: 15px; font-weight: 700; }
.util button:active { transform: scale(.9); }
.util button[aria-pressed="false"] { opacity: .55; }
.status { position: absolute; z-index: 7; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; max-width: calc(20% - 16px); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 3px 14px 3px 10px; border-radius: 999px; background: rgba(30, 24, 44, .62); color: #fff3d8; font-size: 12px; font-weight: 700; backdrop-filter: blur(6px); box-shadow: 0 0 0 1px rgba(201, 164, 92, .6); pointer-events: none; display: flex; gap: 6px; align-items: center; }
.status::before { content: ""; width: 7px; height: 7px; transform: rotate(45deg); background: var(--gold-hi); box-shadow: 0 0 8px var(--gold-hi); }

/* 相談票（金の二重枠） */
.card { position: absolute; z-index: 4; left: 24px; top: 64px; right: calc(20% + 14px); bottom: 24px; overflow: auto; background: linear-gradient(var(--paper), #f3ead6); border-radius: 14px; border: 2px solid var(--gold); padding: 24px 24px 20px; box-shadow: 0 0 0 4px var(--paper), 0 0 0 5px var(--gold-lo), 0 18px 44px rgba(40, 20, 40, .35), inset 0 0 0 1px rgba(255, 255, 255, .6); display: flex; flex-direction: column; gap: 12px; color: var(--ink); scrollbar-width: thin; }
.card.in { animation: panelIn .42s var(--ease-back) both; }
.card.shake { animation: shake .32s; }
@keyframes panelIn { from { transform: scale(.88) translateY(14px); opacity: 0; } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.corner { position: absolute; width: 30px; height: 30px; pointer-events: none; }
.corner svg { width: 100%; height: 100%; display: block; }
.c-tl { left: 4px; top: 4px; } .c-tr { right: 4px; top: 4px; transform: scaleX(-1); } .c-bl { left: 4px; bottom: 4px; transform: scaleY(-1); } .c-br { right: 4px; bottom: 4px; transform: scale(-1, -1); }
.head { display: flex; align-items: center; gap: 12px; }
.door { flex: none; width: 58px; height: 40px; border-radius: 6px; display: grid; place-items: center; font-family: var(--latin); font-weight: 700; font-size: 19px; color: #4a3615; background: linear-gradient(160deg, #fbe7aa, #d4ab5c 55%, #a77d35); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), inset 0 -2px 0 rgba(0, 0, 0, .15), 0 2px 6px rgba(0, 0, 0, .2); text-shadow: 0 1px 0 rgba(255, 255, 255, .5); }
.head .t { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.head .t b { font-family: var(--mincho); font-size: 18px; letter-spacing: .06em; }
.head .t span { font-size: 12px; color: var(--ink-soft); }
.card .rule { color: var(--gold); margin: 0; }
.stem { margin: 0; font-family: var(--mincho); font-weight: 700; font-size: 16.5px; line-height: 1.85; }
.choices { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.choices li { animation: rise .32s var(--ease-quint) both; animation-delay: calc(var(--i) * 45ms + 140ms); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.choices button { position: relative; width: 100%; text-align: left; font-size: 14.5px; color: var(--ink); background: linear-gradient(#fffaf0, #f6eedc); border: 1.5px solid rgba(201, 164, 92, .55); border-radius: 12px; padding: 10px 14px 10px 10px; cursor: pointer; display: grid; grid-template-columns: 30px 1fr; gap: 8px; box-shadow: 0 2px 0 rgba(138, 106, 53, .25); transition: transform .14s var(--ease-quint), border-color .2s, box-shadow .2s; min-height: 44px; }
.choices button:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--gold); box-shadow: 0 4px 0 rgba(138, 106, 53, .3), 0 0 14px rgba(243, 223, 162, .7); }
.choices button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 0 0 rgba(0, 0, 0, 0); }
.choices button:disabled { cursor: default; }
.num { width: 26px; height: 26px; margin-top: 1px; display: grid; place-items: center; font-family: var(--latin); font-weight: 700; font-size: 13px; color: var(--gold-hi); background: var(--night); transform: rotate(45deg) scale(.82); border-radius: 4px; box-shadow: 0 0 0 1.5px var(--gold); }
.num span { transform: rotate(-45deg); }
.choices button.ok { border-color: var(--ok); background: linear-gradient(#f3fbf4, #e3f3e6); animation: okPulse .6s ease-in-out 2; }
.choices button.ok .num { background: var(--ok); color: #fff; }
.choices button.ng { border-color: var(--ng); background: linear-gradient(#fdf3f0, #f7e2dd); }
.choices button.ng .num { background: var(--ng); color: #fff; }
.choices button.dim { opacity: 1; color: var(--ink-soft); }
.choices button.dim .num { opacity: .6; }
@keyframes okPulse { 50% { box-shadow: 0 0 0 4px rgba(79, 174, 115, .35), 0 0 18px rgba(79, 174, 115, .45); } }
.note { grid-column: 2; font-size: 13px; color: var(--ink-soft); border-top: 1px dashed rgba(138, 106, 53, .4); padding-top: 6px; margin-top: 4px; animation: rise .3s var(--ease-quint) both; }
.note::before { content: "管理人さん"; display: inline-block; margin-right: 6px; padding: 0 8px; border-radius: 4px; font-size: 11px; font-weight: 700; color: var(--ink); background: linear-gradient(var(--gold-hi), var(--gold)); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 44px; }
/* 「次の相談へ」は題卡をスクロールしても常に下に見えるように */
.bar { position: sticky; z-index: 2; bottom: 0; margin: 0 -24px -20px; padding: 10px 24px 14px; background: linear-gradient(rgba(243, 234, 214, 0), #f3ead6 30%); }
.bar:has(.cta) { box-shadow: 0 -6px 12px -10px rgba(60, 40, 20, .35); }
.bar .hint { font-size: 12.5px; color: var(--ink-soft); }
.cta { position: relative; overflow: hidden; border: 0; border-radius: 999px; padding: 9px 40px; font-family: var(--maru); font-weight: 700; font-size: 16px; color: var(--ink); background: linear-gradient(#fff3cf, #f0c873); box-shadow: 0 0 0 2px var(--gold-lo), 0 4px 0 var(--gold-lo), 0 8px 18px rgba(0, 0, 0, .18); cursor: pointer; transition: transform .12s var(--ease-quint), box-shadow .12s; }
.cta::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .85), transparent); transform: skewX(-20deg); animation: sweep 3.2s 1s infinite var(--ease-io); }
@keyframes sweep { 0% { left: -60%; } 35%, 100% { left: 130%; } }
.cta i { position: absolute; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; transform: rotate(45deg); background: var(--gold-lo); }
.cta i:first-child { left: 14px; } .cta i:last-of-type { right: 14px; }
.cta:active { transform: translateY(3px); box-shadow: 0 0 0 2px var(--gold-lo), 0 1px 0 var(--gold-lo); }
.stamp { position: absolute; z-index: 3; left: 52%; top: 26px; pointer-events: none; font-family: var(--impact); font-size: 42px; line-height: 1; letter-spacing: .02em; -webkit-text-stroke: 9px #fff; paint-order: stroke fill; filter: drop-shadow(0 3px 0 rgba(43, 37, 34, .3)); animation: stampIn .42s var(--ease-back) both; }
.stamp.ok { color: var(--ink); }
.stamp.ok::before { content: ""; position: absolute; inset: -14px -18px; border-radius: 50%; border: 4px solid var(--r5); box-shadow: 0 0 16px rgba(242, 178, 74, .8), inset 0 0 12px rgba(242, 178, 74, .5); z-index: -1; }
.stamp.ng { color: var(--ng); font-size: 34px; }
/* スタンプは問題文に重ねず、下の「次の相談へ」の帯の左に押す */
.bar .stamp { position: relative; left: auto; top: auto; flex: none; font-size: 30px; -webkit-text-stroke: 7px #fff; margin-left: 6px; }
.bar .stamp.ng { font-size: 26px; }
.bar .stamp.ok::before { inset: -10px -12px; border-width: 3px; }
.bar .hint { flex: 1; min-width: 0; }
@keyframes stampIn { from { transform: scale(2.2) rotate(-16deg); opacity: 0; } 60% { transform: scale(.9) rotate(-8deg); opacity: 1; } to { transform: scale(1) rotate(-8deg); } }

/* William の吹き出し */
.bubble { position: absolute; z-index: 8; left: 0; top: 0; max-width: 230px; pointer-events: none; background: #fff; border: 2px solid var(--ink); border-radius: 18px; padding: 12px 16px 9px; font-family: var(--kiwi); font-size: 15px; line-height: 1.55; color: var(--ink); box-shadow: 0 4px 0 rgba(43, 37, 34, .15); opacity: 0; transition: opacity .18s; }
.bubble.on { opacity: 1; }
.bubble.pop { animation: pop .28s var(--ease-back); }
.bubble::after { content: ""; position: absolute; left: var(--tx, 50%); bottom: -10px; width: 16px; height: 16px; margin-left: -8px; background: #fff; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(45deg); }
.bubble.side::after { display: none; }
.bubble .np { position: absolute; top: -13px; left: 12px; padding: 0 10px; border-radius: 6px; font-family: var(--mincho); font-weight: 800; font-size: 12px; letter-spacing: .06em; color: var(--ink); background: linear-gradient(var(--gold-hi), var(--gold)); box-shadow: 0 0 0 1px var(--gold-lo); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }

/* モーダル（あそびかた・報酬） */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 30, .6); display: grid; place-items: center; padding: 16px; animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.panel { position: relative; width: min(520px, 100%); max-height: calc(100% - 32px); overflow: auto; background: linear-gradient(var(--paper), #f3ead6); border: 2px solid var(--gold); border-radius: 14px; box-shadow: 0 0 0 4px var(--paper), 0 0 0 5px var(--gold-lo), 0 24px 60px rgba(0, 0, 0, .45); padding: 26px 26px 22px; animation: panelIn .36s var(--ease-back) both; color: var(--ink); display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; text-align: center; font-family: var(--mincho); font-weight: 800; font-size: 22px; letter-spacing: .12em; }
.panel ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 13px; }
.panel li { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.panel li::before { content: ""; flex: none; width: 6px; height: 6px; transform: rotate(45deg) translateY(-2px); background: var(--gold); }
.panel li b { font-weight: 700; }
.panel .row { display: flex; justify-content: center; }
.reward { text-align: center; align-items: center; }
.pillar { position: absolute; left: 50%; top: -30%; bottom: 30%; width: 120px; margin-left: -60px; background: linear-gradient(transparent, rgba(255, 214, 120, .55), transparent); filter: blur(10px); animation: pillar .5s var(--ease-quint) both; pointer-events: none; }
@keyframes pillar { from { transform: scaleY(0); opacity: 0; } }
.item { position: relative; width: 96px; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: linear-gradient(160deg, #f8d99a, var(--r5)); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--r5), 0 0 30px rgba(242, 178, 74, .8); display: grid; place-items: center; animation: pop .45s .25s var(--ease-back) both; }
.item::before { content: ""; position: absolute; inset: -40%; background: conic-gradient(from 0deg, transparent, rgba(255, 245, 200, .95), transparent 30%); animation: spin 2.4s linear infinite; mix-blend-mode: screen; }
.item svg { position: relative; width: 60%; }
@keyframes spin { to { transform: rotate(360deg); } }
.reward .nm { font-family: var(--mincho); font-weight: 800; font-size: 18px; animation: rise .3s .45s both; }
.reward p { margin: 0; font-size: 13px; color: var(--ink-soft); }

/* カットイン（3連続正解など） */
.cutin { position: absolute; inset: 0; z-index: 9; pointer-events: none; overflow: hidden; }
.cutin .band { position: absolute; left: -10%; right: -10%; top: 30%; height: 34%; background: linear-gradient(90deg, rgba(21, 39, 84, .94), rgba(96, 64, 150, .94)); transform: skewY(-6deg) scaleY(0); animation: band 1.8s var(--ease-quint) both; box-shadow: 0 0 0 3px var(--gold), 0 0 40px rgba(242, 178, 74, .6); }
.cutin .band::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(100deg, transparent 0 40px, rgba(255, 255, 255, .06) 40px 44px); }
@keyframes band { 12%, 82% { transform: skewY(-6deg) scaleY(1); } 100% { transform: skewY(-6deg) scaleY(0); } }
.cutin img { position: absolute; z-index: 2; right: 6%; top: 14%; height: 66%; animation: cin 1.8s var(--ease-quint) both; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .45)); }
@keyframes cin { 0% { transform: translateX(130%); opacity: 1; } 18%, 80% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(-20%); opacity: 0; } }
.cutin b { position: absolute; left: 7%; top: 35%; font-family: var(--impact); font-weight: 400; font-size: clamp(38px, 6vw, 76px); color: #fff; -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; animation: tin 1.8s var(--ease-back) both; }
.cutin small { position: absolute; left: 8%; top: 55%; font-family: var(--mincho); font-weight: 800; color: var(--gold-hi); font-size: 18px; letter-spacing: .2em; animation: tin 1.8s .1s var(--ease-back) both; }
@keyframes tin { 0% { transform: translateX(-60%) scale(1.4); opacity: 0; } 20%, 80% { transform: none; opacity: 1; } 100% { opacity: 0; } }
/* 階へ入るときのワイプ */
.wipe { position: fixed; inset: 0; z-index: 30; background: linear-gradient(120deg, var(--night-2), var(--dusk)); display: grid; place-items: center; clip-path: polygon(0 0, 120% 0, 100% 100%, -20% 100%); animation: wipeOut .5s 1.5s var(--ease-io) forwards; pointer-events: none; }
.wipe .ttl { text-align: center; color: #f6ecd6; animation: panelIn .5s .1s var(--ease-back) both; }
.wipe .ttl small { display: block; font-family: var(--latin); letter-spacing: .5em; font-size: 12px; color: var(--gold-hi); }
.wipe .ttl b { display: block; font-family: var(--mincho); font-weight: 800; font-size: 34px; letter-spacing: .12em; margin: 6px 0; }
.wipe .ttl .rule { width: 260px; margin: 0 auto; animation: grow .5s .3s var(--ease-quint) both; }
.wipe .ttl span { font-size: 13px; color: #cfc8de; }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes wipeOut { to { clip-path: polygon(120% 0, 120% 0, 100% 100%, 100% 100%); } }

/* 背の低い画面（タブレット横など）：題卡を詰める */
@media (max-height: 760px) {
	.card { padding: 16px 18px 12px; gap: 8px; }
	.bar { bottom: 0; margin: 0 -18px -12px; padding: 8px 18px 10px; }
	.stem { font-size: 15px; line-height: 1.7; }
	.choices { gap: 6px; }
	.choices button { font-size: 13.5px; padding: 6px 10px 6px 8px; line-height: 1.55; }
	.head .t b { font-size: 16px; }
}
.back { display: none; }
.credit { position: absolute; z-index: 3; left: 0; right: 0; bottom: 5px; text-align: center; font-size: 9px; line-height: 1.3; color: rgba(233, 226, 210, .55); padding: 0 8px; pointer-events: none; }
/* 窓の明かり：最初は全部消えていて、正解するたびに1つずつ点く */
.win { position: absolute; z-index: 1; border-radius: 2px; pointer-events: none; background: linear-gradient(160deg, #26304f, #141a33 70%); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .35); transition: background .4s; }
.win::before { content: ""; position: absolute; left: 49%; top: 0; bottom: 0; width: 2px; background: rgba(0, 0, 0, .35); }
.win::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255, 255, 255, .1), transparent 45%); }
.win.on { background: radial-gradient(ellipse at 50% 60%, #fff4c9, #ffd27e 45%, #f2a54f); box-shadow: 0 0 14px 4px rgba(255, 200, 110, .65), 0 0 40px 10px rgba(255, 180, 90, .25); }
.win.ignite { animation: ignite 1.1s var(--ease-quint); }
@keyframes ignite { 0% { filter: brightness(3.5); transform: scale(1.35); } 12% { filter: brightness(.6); } 22% { filter: brightness(2.4); } 34% { filter: brightness(.9); } 100% { filter: none; transform: none; } }
.win.fizzle { animation: fizzle .9s steps(1); }
@keyframes fizzle { 0%, 30%, 60% { background: radial-gradient(#ffe9b0, #e09a4a); box-shadow: 0 0 10px rgba(255, 200, 110, .6); } 15%, 45%, 100% { background: linear-gradient(160deg, #26304f, #141a33 70%); box-shadow: none; } }
.ray { position: absolute; z-index: 2; pointer-events: none; width: 160%; height: 160%; left: -30%; top: -30%; background: conic-gradient(from 0deg, transparent, rgba(255, 236, 180, .9) 8%, transparent 16%, transparent 33%, rgba(255, 236, 180, .9) 41%, transparent 49%, transparent 66%, rgba(255, 236, 180, .9) 74%, transparent 82%); border-radius: 50%; mix-blend-mode: screen; animation: ray 1s var(--ease-quint) forwards; }
@keyframes ray { from { transform: scale(.2) rotate(0); opacity: 1; } to { transform: scale(2.2) rotate(70deg); opacity: 0; } }
.spark { position: fixed; z-index: 40; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; border-radius: 50%; background: radial-gradient(#fff, #ffe6a0 40%, rgba(255, 190, 90, 0) 70%); box-shadow: 0 0 18px 8px rgba(255, 210, 120, .7); }
.trail { position: fixed; z-index: 39; width: 6px; height: 6px; margin: -3px 0 0 -3px; pointer-events: none; border-radius: 50%; background: #fff2c4; box-shadow: 0 0 8px rgba(255, 210, 120, .9); animation: trail .7s ease-out forwards; }
@keyframes trail { to { transform: scale(.2) translateY(10px); opacity: 0; } }
.plate .star { color: var(--gold-hi); font-size: 11px; margin-left: 2px; text-shadow: 0 0 6px rgba(255, 220, 140, .9); animation: pop .4s var(--ease-back); }
.bldg.sweep::before { content: ""; position: absolute; z-index: 2; left: 0; right: 0; height: 30%; bottom: -30%; background: linear-gradient(transparent, rgba(255, 230, 170, .35), transparent); animation: sweep2 1.4s var(--ease-io) forwards; pointer-events: none; }
@keyframes sweep2 { to { bottom: 110%; } }
/* スマホ：画面を2つに分ける（① 楼 → 階をタップ → ② 題卡＋キャットタワー） */
@media (max-width: 760px) {
	.app { grid-template-columns: 1fr; }
	.app.show-tower .room, .app.show-room .tower { display: none; }
	.tower { padding-right: env(safe-area-inset-right, 0px); }
	.brand { height: 56px; }
	.bldgwrap { padding: 0 16px 16px; }
	.hud { top: 10px; left: 12px; right: 12px; gap: 5px; flex-wrap: nowrap; }
	.util { gap: 4px; } .util button { width: 28px; height: 28px; font-size: 12px; }

// ---------------- 効果音（WebAudio で合成） ----------------
let AC = null, seOn = true;
try { seOn = localStorage.getItem('w-se') !== '0'; } catch (e) {}
$('seBtn').setAttribute('aria-pressed', String(seOn));
$('seBtn').addEventListener('click', () => { seOn = !seOn; $('seBtn').setAttribute('aria-pressed', String(seOn)); try { localStorage.setItem('w-se', seOn ? '1' : '0'); } catch (e) {} if (seOn) se('tap'); });
function tone(f0, f1, dur, type = 'sine', gain = 0.25, delay = 0) {
	const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
	o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
	g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
	o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function se(kind) {
	if (!seOn) return;
	try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
	if (kind === 'tap') tone(1200, 1200, 0.04, 'triangle', 0.08);
	if (kind === 'ok') { tone(1046, 1046, 0.35, 'sine', 0.22); tone(1568, 1568, 0.5, 'sine', 0.2, 0.07); }
	if (kind === 'ng') tone(240, 170, 0.16, 'sine', 0.25);
	if (kind === 'nya') tone(760, 480, 0.17, 'triangle', 0.12);
	if (kind === 'jump') tone(420, 900, 0.12, 'sine', 0.08);
	if (kind === 'reward') [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.4, 'sine', 0.2, i * 0.09));
}

const MOUTH = { x: 153, y: 224 };

	c.restore();
}
