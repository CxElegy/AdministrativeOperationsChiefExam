name: Deploy to GitHub Pages

on:
  push:
    # github-pages 環境はリポジトリの既定ブランチからしか公開できないので、既定ブランチ（いまは作業ブランチ）でも公開する
    branches: [main, claude/clever-franklin-7sudl7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # サイトは 1 ページ（William の部屋）。問題データと絵を埋め込んで dist/ に出す（Python だけで作れる）
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
