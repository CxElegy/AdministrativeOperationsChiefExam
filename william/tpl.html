<title>William の部屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Maru+Gothic:wght@500;700&family=Kiwi+Maru:wght@500&family=Dela+Gothic+One&family=Cinzel:wght@600;700&display=swap">
<style>
/* layout: 左＝夕暮れのマンション（階＝分野のノード）、右＝夕焼けの William の部屋。相談票は金縁の紙のパネルで部屋の手前に浮かぶ。
   ゲームのイベントページ風：金の二重枠・光のスイープ・星のはじけ・スタンプ・報酬演出 */
:root {
	--ink: #2b2522; --ink-soft: #5a4a40; --paper: #f7f1e3; --paper-2: #ece3cf;
	--gold: #c9a45c; --gold-hi: #f3dfa2; --gold-lo: #8a6a35;
	--night: #152754; --night-2: #0d1838; --dusk: #3a2f5c;
	--ok: #4fae73; --ng: #d9615a; --r5: #f2b24a; --lilac: #a68cd8;
	--ease-back: cubic-bezier(.34, 1.56, .64, 1); --ease-quint: cubic-bezier(.22, 1, .36, 1); --ease-io: cubic-bezier(.65, 0, .35, 1);
	--mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
	--maru: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
	--kiwi: "Kiwi Maru", "Zen Maru Gothic", sans-serif;
	--impact: "Dela Gothic One", "Zen Maru Gothic", sans-serif;
	--latin: "Cinzel", "Times New Roman", serif;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--night-2); color: var(--ink); font-family: var(--maru); line-height: 1.7; overflow-x: hidden; }
button { font: inherit; }
button:focus-visible { outline: 3px solid #ffe7a8; outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-columns: minmax(280px, 3fr) minmax(0, 7fr); }  /* マンション：相談票と部屋 ＝ 3：7 */
/* 楼的上下和题卡对齐：标题在上面 64px 的带里，楼从 64px 到底下 24px */

/* ---------- 左：マンション ---------- */
.tower { position: relative; background: linear-gradient(#090a18, #12132a 45%, #18182b); color: #f3ead8; display: flex; flex-direction: column; padding-left: env(safe-area-inset-left, 0px); overflow: hidden; min-height: 0; }
.brand { height: 64px; padding: 10px 16px 0; position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; }
.brand .en { font-family: var(--latin); font-size: 11px; letter-spacing: .5em; color: var(--gold-hi); opacity: .85; }
.brand h1 { margin: 0; font-family: var(--mincho); font-weight: 800; font-size: 22px; letter-spacing: .08em; line-height: 1.2; text-shadow: 0 2px 18px rgba(255, 200, 120, .35); }
.brand h1 i { font-style: normal; color: var(--gold-hi); font-size: .6em; vertical-align: .55em; margin-left: 2px; }
.brand p, .brand .rule { display: none; }
.rule { display: flex; align-items: center; gap: 8px; color: var(--gold); margin: 10px 0 0; }
.rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, currentColor); }
.rule::after { transform: scaleX(-1); }
.rule i { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid currentColor; background: var(--gold-hi); }
/* 建物の絵は欄の下にぴったり置き、上は同じ色の夜空（星）でつなぐ。地面の下にも道路を続ける */
.tower::before { content: ""; position: absolute; inset: 0 0 30% 0; pointer-events: none; opacity: .8;
	background-image: radial-gradient(1.2px 1.2px at 12% 18%, #fff 50%, transparent), radial-gradient(1px 1px at 28% 42%, #e8e2ff 50%, transparent), radial-gradient(1.4px 1.4px at 46% 12%, #fff 50%, transparent), radial-gradient(1px 1px at 63% 33%, #fff6d8 50%, transparent), radial-gradient(1.2px 1.2px at 81% 22%, #fff 50%, transparent), radial-gradient(1px 1px at 92% 48%, #e8e2ff 50%, transparent), radial-gradient(1px 1px at 7% 58%, #fff 50%, transparent), radial-gradient(1.3px 1.3px at 37% 66%, #fff6d8 50%, transparent), radial-gradient(1px 1px at 72% 61%, #fff 50%, transparent), radial-gradient(1px 1px at 55% 80%, #e8e2ff 50%, transparent); animation: twinkle 5s ease-in-out infinite alternate; }
@keyframes twinkle { to { opacity: .45; } }
.tower > * { position: relative; }
.bldgwrap { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-end; padding: 0; background: linear-gradient(transparent calc(100% - 8px), #0b070d calc(100% - 8px)); }
/* 建物は絵（夜のマンション）。窓のボタンを絵の窓の上に重ねる。最初は全部暗く、正解すると明かりがつく */
.bldg { --k: .5; position: relative; flex: none; background: url(__BLDG__) center / 100% 100% no-repeat; -webkit-mask-image: linear-gradient(transparent, #000 7%); mask-image: linear-gradient(transparent, #000 7%); }
.ftag { position: absolute; z-index: 3; left: .6%; width: 8.4%; transform: translateY(-50%); border: 0; padding: 3px 0; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 1px; background: linear-gradient(#3a3156, #241d3d); color: #f3ead8; box-shadow: 0 0 0 1px var(--gold-lo), 0 3px 8px rgba(0, 0, 0, .35); cursor: pointer; }
.ftag b { font-family: var(--latin); font-size: max(10px, calc(var(--k) * 22px)); line-height: 1.1; color: var(--gold-hi); }
.ftag small { font-size: max(7px, calc(var(--k) * 13px)); line-height: 1.1; white-space: nowrap; overflow: hidden; max-width: 96%; }
.ftag.cur { background: linear-gradient(#fff5d9, #f0d08a); color: var(--ink); box-shadow: 0 0 0 1px var(--gold-lo), 0 0 14px rgba(255, 210, 140, .7); }
.ftag.cur b { color: var(--ink); }
.ftag.star b::after { content: "★"; font-size: .7em; margin-left: 1px; color: #e9b44c; }
.ftag:hover { filter: brightness(1.15); }
.win { --lv: 0; --ok: 0; --ng: 0; position: absolute; z-index: 1; padding: 0; border: 0; border-radius: 1px; cursor: pointer; background: transparent; display: grid; place-items: center; color: rgba(233, 226, 210, .55); transition: transform .15s, box-shadow .5s; }
.win .glow { position: absolute; inset: 0; opacity: var(--lv); background: radial-gradient(ellipse at 50% 60%, #fff4c9, #ffd27e 45%, #f2a54f); transition: opacity .6s; }
.win::after { content: ""; position: absolute; top: 0; bottom: 0; left: 49%; width: 2px; background: rgba(60, 30, 20, .55); pointer-events: none; }
.win i { position: relative; z-index: 1; font-style: normal; font-family: var(--latin); font-weight: 700; font-size: max(8px, calc(var(--k) * 20px)); line-height: 1; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
.win .meter { position: absolute; z-index: 1; left: 8%; right: 8%; bottom: 6%; height: max(2px, calc(var(--k) * 5px)); border-radius: 2px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.win .meter .o, .win .meter .x { position: absolute; top: 0; bottom: 0; }
.win .meter .o { left: 0; width: calc(var(--ok) * 100%); background: #ffe08a; box-shadow: 0 0 4px #ffd27e; }
.win .meter .x { left: calc(var(--ok) * 100%); width: calc(var(--ng) * 100%); background: #e0758f; }
.win.lit { box-shadow: 0 0 14px 4px rgba(255, 200, 110, .6), 0 0 40px 10px rgba(255, 180, 90, .22); color: rgba(90, 52, 18, .85); }
.win.lit i { text-shadow: none; }
.win.lit .meter { background: rgba(120, 70, 20, .25); } .win.lit .meter .o { background: #fff7d8; }
.win.full i::after { content: "★"; font-size: .8em; color: #b5741c; }
.win.here { outline: 2px solid var(--gold-hi); outline-offset: 2px; z-index: 2; }
.win:hover { transform: scale(1.08); z-index: 2; }
.win.glint { animation: glint .9s var(--ease-quint); }
@keyframes glint { 0% { filter: brightness(2.2); transform: scale(1.15); } 100% { filter: none; transform: none; } }
.win.nudge { animation: nudge .45s; }
@keyframes nudge { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }
.tidx { display: none; }
/* ほかの住人の部屋：最初から明かりがついている（窓ごとに明るさ・色・カーテンが違う） */
.res { position: absolute; z-index: 1; pointer-events: none; opacity: var(--a); }
.res.warm { background: radial-gradient(ellipse at var(--x) 65%, hsl(var(--h) 100% 82%), hsl(var(--h) 85% 62%) 55%, hsl(calc(var(--h) - 6) 70% 45%)); }
.res.dim { background: radial-gradient(ellipse at var(--x) 80%, hsl(var(--h) 90% 66%), hsl(calc(var(--h) - 8) 60% 32%) 70%); opacity: calc(var(--a) * .75); }
.res.curtain { background: linear-gradient(90deg, hsl(var(--h) 45% 58%) 0 38%, transparent 38% 62%, hsl(var(--h) 45% 58%) 62%), radial-gradient(ellipse at 50% 60%, hsl(var(--h) 100% 80%), hsl(var(--h) 80% 55%)); }
.res.tv { background: radial-gradient(ellipse at var(--x) 70%, #cfe3ff, #6f8fd6 55%, #2b3a6b); opacity: calc(var(--a) * .8); }
.res::after { content: ""; position: absolute; top: 0; bottom: 0; left: 49%; width: 2px; background: rgba(60, 30, 20, .55); }
.finfo { position: relative; z-index: 2; margin: 0 14px 8px; padding: 6px 12px; border-radius: 10px; background: rgba(13, 24, 56, .55); box-shadow: inset 0 0 0 1px rgba(201, 164, 92, .55); font-size: 12px; line-height: 1.55; color: #e9e2d2; display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
.finfo b { font-family: var(--mincho); color: var(--gold-hi); font-size: 13.5px; }
.finfo .lg { display: inline-flex; gap: 4px; align-items: center; }
.finfo .lg i { display: inline-block; width: 11px; height: 9px; border-radius: 2px; margin-left: 6px; background: linear-gradient(160deg, #26304f, #141a33); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }
.finfo .lg i:first-child { margin-left: 0; }
.finfo .lg i.ok { background: #ffd27e; box-shadow: 0 0 6px rgba(255, 200, 110, .8); }
.finfo .lg i.ng { background: repeating-linear-gradient(90deg, #a5637a 0 2px, #8a4d66 2px 4px); }
.finfo .all { opacity: .75; font-size: 11px; }

/* ---------- 右：部屋 ---------- */
.room { position: relative; height: 100%; min-height: 0; overflow: hidden; touch-action: manipulation; background: #cf9a79; }
.room canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fg { pointer-events: none; z-index: 6; }
#l2d { pointer-events: none; z-index: 5; filter: sepia(.08) drop-shadow(0 2px 2px rgba(59, 36, 64, .38)); }
#l2d.heat { filter: sepia(.5) saturate(2.4) hue-rotate(-28deg) drop-shadow(0 2px 2px rgba(59, 36, 64, .38)); }
.bloom { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(circle at 82% 14%, rgba(255, 228, 170, .5), transparent 55%); mix-blend-mode: screen; }
.hud { position: absolute; z-index: 7; top: 14px; left: 24px; right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.hud > * { pointer-events: auto; }
.pill { padding: 3px 12px; border-radius: 999px; background: rgba(255, 250, 238, .78); border: 1px solid rgba(43, 37, 34, .15); font-weight: 700; font-size: 13px; color: var(--ink); backdrop-filter: blur(6px); font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; align-items: center; }
.pill.bump { animation: bump .22s var(--ease-back); }
@keyframes bump { 50% { transform: scale(1.25); } }
.pill .heart { color: var(--ng); }
.util { margin-left: auto; display: flex; gap: 8px; }
.util button { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid rgba(201, 164, 92, .9); background: rgba(43, 37, 34, .38); backdrop-filter: blur(6px); color: #fff7e0; display: grid; place-items: center; cursor: pointer; font-size: 15px; font-weight: 700; }
.util button:active { transform: scale(.9); }
.util button[aria-pressed="false"] { opacity: .55; }
.status { position: absolute; z-index: 7; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; max-width: calc(20% - 16px); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 3px 14px 3px 10px; border-radius: 999px; background: rgba(30, 24, 44, .62); color: #fff3d8; font-size: 12px; font-weight: 700; backdrop-filter: blur(6px); box-shadow: 0 0 0 1px rgba(201, 164, 92, .6); pointer-events: none; display: flex; gap: 6px; align-items: center; }
.status::before { content: ""; width: 7px; height: 7px; transform: rotate(45deg); background: var(--gold-hi); box-shadow: 0 0 8px var(--gold-hi); }

/* 相談票（金の二重枠） */
.card { position: absolute; z-index: 4; left: 24px; top: 64px; right: calc(20% + 14px); bottom: 24px; overflow: auto; background: linear-gradient(var(--paper), #f3ead6); border-radius: 14px; border: 2px solid var(--gold); padding: 24px 24px 20px; box-shadow: 0 0 0 4px var(--paper), 0 0 0 5px var(--gold-lo), 0 18px 44px rgba(40, 20, 40, .35), inset 0 0 0 1px rgba(255, 255, 255, .6); display: flex; flex-direction: column; gap: 12px; color: var(--ink); scrollbar-width: thin; }
.card.in { animation: panelIn .42s var(--ease-back) both; }
.card.shake { animation: shake .32s; }
@keyframes panelIn { from { transform: scale(.88) translateY(14px); opacity: 0; } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.corner { position: absolute; width: 30px; height: 30px; pointer-events: none; }
.corner svg { width: 100%; height: 100%; display: block; }
.card .c-bl, .card .c-br { display: none; }  /* 相談票はスクロールするので、下の角飾りが文字に重ならないよう出さない */
.c-tl { left: 4px; top: 4px; } .c-tr { right: 4px; top: 4px; transform: scaleX(-1); } .c-bl { left: 4px; bottom: 4px; transform: scaleY(-1); } .c-br { right: 4px; bottom: 4px; transform: scale(-1, -1); }
.head { display: flex; align-items: center; gap: 12px; }
.door { flex: none; width: 58px; height: 40px; border-radius: 6px; display: grid; place-items: center; font-family: var(--latin); font-weight: 700; font-size: 19px; color: #4a3615; background: linear-gradient(160deg, #fbe7aa, #d4ab5c 55%, #a77d35); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), inset 0 -2px 0 rgba(0, 0, 0, .15), 0 2px 6px rgba(0, 0, 0, .2); text-shadow: 0 1px 0 rgba(255, 255, 255, .5); }
.head .t { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.head .t b { font-family: var(--mincho); font-size: 18px; letter-spacing: .06em; }
.head .t span { font-size: 12px; color: var(--ink-soft); }
.card .rule { color: var(--gold); margin: 0; }
.stem { margin: 0; font-family: var(--mincho); font-weight: 700; font-size: 16.5px; line-height: 1.85; }
.choices { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.choices li { animation: rise .32s var(--ease-quint) both; animation-delay: calc(var(--i) * 45ms + 140ms); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.choices button { position: relative; width: 100%; text-align: left; font-size: 14.5px; color: var(--ink); background: linear-gradient(#fffaf0, #f6eedc); border: 1.5px solid rgba(201, 164, 92, .55); border-radius: 12px; padding: 10px 14px 10px 10px; cursor: pointer; display: grid; grid-template-columns: 30px 1fr; gap: 8px; box-shadow: 0 2px 0 rgba(138, 106, 53, .25); transition: transform .14s var(--ease-quint), border-color .2s, box-shadow .2s; min-height: 44px; }
.choices button:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--gold); box-shadow: 0 4px 0 rgba(138, 106, 53, .3), 0 0 14px rgba(243, 223, 162, .7); }
.choices button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 0 0 rgba(0, 0, 0, 0); }
.choices button:disabled { cursor: default; }
.num { width: 26px; height: 26px; margin-top: 1px; display: grid; place-items: center; font-family: var(--latin); font-weight: 700; font-size: 13px; color: var(--gold-hi); background: var(--night); transform: rotate(45deg) scale(.82); border-radius: 4px; box-shadow: 0 0 0 1.5px var(--gold); }
.num span { transform: rotate(-45deg); }
.choices button.ok { border-color: var(--ok); background: linear-gradient(#f3fbf4, #e3f3e6); animation: okPulse .6s ease-in-out 2; }
.choices button.ok .num { background: var(--ok); color: #fff; }
.choices button.ng { border-color: var(--ng); background: linear-gradient(#fdf3f0, #f7e2dd); }
.choices button.ng .num { background: var(--ng); color: #fff; }
.choices button.dim { opacity: 1; color: var(--ink-soft); }
.choices button.dim .num { opacity: .6; }
@keyframes okPulse { 50% { box-shadow: 0 0 0 4px rgba(79, 174, 115, .35), 0 0 18px rgba(79, 174, 115, .45); } }
.note { grid-column: 2; font-size: 13px; color: var(--ink-soft); border-top: 1px dashed rgba(138, 106, 53, .4); padding-top: 6px; margin-top: 4px; animation: rise .3s var(--ease-quint) both; }
.note::before { content: "管理人さん"; display: inline-block; margin-right: 6px; padding: 0 8px; border-radius: 4px; font-size: 11px; font-weight: 700; color: var(--ink); background: linear-gradient(var(--gold-hi), var(--gold)); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 44px; }
/* 「次の相談へ」は題卡をスクロールしても常に下に見えるように */
.bar { position: relative; z-index: 2; margin: 0 -24px -20px; padding: 10px 24px 14px; background: #f3ead6; border-radius: 0 0 12px 12px; }
/* 答えたあと（「次の相談へ」があるとき）だけ下に固定。背景は不透明にして、後ろの選択肢と文字が重ならないように */
.bar:has(.cta) { position: sticky; bottom: 0; border-top: 1px solid rgba(201, 164, 92, .55); box-shadow: 0 -8px 14px -10px rgba(60, 40, 20, .4); }
.bar .hint { font-size: 12.5px; color: var(--ink-soft); }
.cta { position: relative; overflow: hidden; border: 0; border-radius: 999px; padding: 9px 40px; font-family: var(--maru); font-weight: 700; font-size: 16px; color: var(--ink); background: linear-gradient(#fff3cf, #f0c873); box-shadow: 0 0 0 2px var(--gold-lo), 0 4px 0 var(--gold-lo), 0 8px 18px rgba(0, 0, 0, .18); cursor: pointer; transition: transform .12s var(--ease-quint), box-shadow .12s; }
.cta::after { content: ""; position: absolute; top: -20%; bottom: -20%; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .85), transparent); transform: skewX(-20deg); animation: sweep 3.2s 1s infinite var(--ease-io); }
@keyframes sweep { 0% { left: -60%; } 35%, 100% { left: 130%; } }
.cta i { position: absolute; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; transform: rotate(45deg); background: var(--gold-lo); }
.cta i:first-child { left: 14px; } .cta i:last-of-type { right: 14px; }
.cta:active { transform: translateY(3px); box-shadow: 0 0 0 2px var(--gold-lo), 0 1px 0 var(--gold-lo); }
.stamp { position: absolute; z-index: 3; left: 52%; top: 26px; pointer-events: none; font-family: var(--impact); font-size: 42px; line-height: 1; letter-spacing: .02em; -webkit-text-stroke: 9px #fff; paint-order: stroke fill; filter: drop-shadow(0 3px 0 rgba(43, 37, 34, .3)); animation: stampIn .42s var(--ease-back) both; }
.stamp.ok { color: var(--ink); }
.stamp.ok::before { content: ""; position: absolute; inset: -14px -18px; border-radius: 50%; border: 4px solid var(--r5); box-shadow: 0 0 16px rgba(242, 178, 74, .8), inset 0 0 12px rgba(242, 178, 74, .5); z-index: -1; }
.stamp.ng { color: var(--ng); font-size: 34px; }
/* スタンプは問題文に重ねず、下の「次の相談へ」の帯の左に押す */
.bar .stamp { position: relative; left: auto; top: auto; flex: none; font-size: 30px; -webkit-text-stroke: 7px #fff; margin-left: 6px; }
.bar .stamp.ng { font-size: 26px; }
.bar .stamp.ok::before { inset: -10px -12px; border-width: 3px; }
.bar .hint { flex: 1; min-width: 0; }
@keyframes stampIn { from { transform: scale(2.2) rotate(-16deg); opacity: 0; } 60% { transform: scale(.9) rotate(-8deg); opacity: 1; } to { transform: scale(1) rotate(-8deg); } }

/* William の吹き出し */
.bubble { position: absolute; z-index: 8; left: 0; top: 0; max-width: 230px; pointer-events: none; background: #fff; border: 2px solid var(--ink); border-radius: 18px; padding: 12px 16px 9px; font-family: var(--kiwi); font-size: 15px; line-height: 1.55; color: var(--ink); box-shadow: 0 4px 0 rgba(43, 37, 34, .15); opacity: 0; transition: opacity .18s; }
.bubble.on { opacity: 1; }
.bubble.pop { animation: pop .28s var(--ease-back); }
.bubble::after { content: ""; position: absolute; left: var(--tx, 50%); bottom: -10px; width: 16px; height: 16px; margin-left: -8px; background: #fff; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(45deg); }
.bubble.side::after { display: none; }
.bubble .np { position: absolute; top: -13px; left: 12px; padding: 0 10px; border-radius: 6px; font-family: var(--mincho); font-weight: 800; font-size: 12px; letter-spacing: .06em; color: var(--ink); background: linear-gradient(var(--gold-hi), var(--gold)); box-shadow: 0 0 0 1px var(--gold-lo); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }

/* モーダル（あそびかた・報酬） */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 30, .6); display: grid; place-items: center; padding: 16px; animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }

	if (F.bubble) { const r = 5 + 9 * (0.5 + 0.5 * Math.sin(t / 700)); c.fillStyle = 'rgba(200,230,255,.45)'; c.strokeStyle = 'rgba(120,160,200,.8)'; c.lineWidth = 1.5; c.beginPath(); c.arc(x + 14 + r, y - 12, r, 0, Math.PI * 2); c.fill(); c.stroke(); c.fillStyle = 'rgba(255,255,255,.8)'; c.beginPath(); c.arc(x + 11 + r * 1.4, y - 12 - r * 0.4, r * 0.2, 0, Math.PI * 2); c.fill(); }
	c.restore();
}
